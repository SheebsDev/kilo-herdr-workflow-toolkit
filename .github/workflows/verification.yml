name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Run installer matrix explicitly
        run: npm run test:installer
